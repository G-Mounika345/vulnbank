<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>VulnBank - Search</title></head>
<body>
<h1>Search</h1>
<form method="get" action="/search">
    <input type="text" name="q" th:value="${query}"/>
    <button type="submit">Search</button>
</form>
<!-- VULNERABLE: unescaped output -> reflected XSS -->
<p>You searched for: <span th:utext="${query}"></span></p>
</body>
</html>
