server.port=8080

# --- A05:2021 Security Misconfiguration ---
# All actuator endpoints exposed, including /env and /heapdump which can leak
# secrets and memory contents. Try: http://localhost:8080/actuator
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=ALWAYS

# Verbose error pages leak stack traces (also A05) - try requesting a bad param
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true

spring.thymeleaf.cache=false

# --- A02:2021 Cryptographic Failures ---
# Hardcoded "secret" used for JWT signing (see JwtUtil.java) and a hardcoded
# DB-adjacent credential below - both are things a real scanner / grep -R
# secrets across a repo would flag instantly.
app.jwt.secret=vulnbank-super-secret-key-123
app.admin.backdoor.password=Sup3rAdmin!2023

# H2 in-memory DB, console exposed with no auth barrier of its own beyond
# Spring Security config (which we've also weakened) - A05
spring.datasource.url=jdbc:h2:mem:vulnbank;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

logging.level.org.springframework.security=DEBUG
