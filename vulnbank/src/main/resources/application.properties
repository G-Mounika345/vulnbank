server.port=8080

# --- A05:2021 Security Misconfiguration ---
# All actuator endpoints exposed, including /env and /heapdump which can leak
# secrets and memory contents. Try: http://localhost:8080/actuator
management.endpoints.web.exposure.include=*
management.endpoint.env.show-values=ALWAYS

# Verbose error pages leak stack traces (also A05) - try requesting a bad param
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-exception=true

spring.thymeleaf.cache=false

# --- A02:2021 Cryptographic Failures ---
# Hardcoded "secret" used for JWT signing (see JwtUtil.java) and a hardcoded
# DB-adjacent credential below - both are things a real scanner / grep -R
# secrets across a repo would flag instantly.
app.jwt.secret=vulnbank-super-secret-key-123
app.admin.backdoor.password=Sup3rAdmin!2023

# MySQL database. Credentials hardcoded here in plaintext on purpose -
# same A02/A05 "secrets in source control" pattern as the JWT secret and
# admin backdoor password above. Point this at a real MySQL 8.x instance
# with a `vulnbank` schema (CREATE DATABASE vulnbank;) before starting.
spring.datasource.url=jdbc:mysql://localhost:3306/vulnbank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# "update" (not create-drop) so credited/debited balances persist across
# app restarts instead of being wiped like the old in-memory H2 setup.
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

logging.level.org.springframework.security=DEBUG
